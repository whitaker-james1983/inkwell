[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inkwell"
version = "1.0.0"
description = "Self-hosted invoicing for freelancers: JSON in, HTML invoices out."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "James Whitaker", email = "whitaker.james1983@outlook.com"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
inkwell = "inkwell.cli:main"
